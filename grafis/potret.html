<!doctype html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grafis · potret 1080x1350</title>
<link rel="stylesheet" href="grafis.css">
<script src="../dokumen/cetak/dokumen.js"></script>
<script src="grafis.js"></script>
</head>
<body class="pratinjau">
<!-- Post potret 1080x1350 (4:5). Contoh acara: ganti semua teks dalam kurung siku. -->
<h2>potret-acara · kertas</h2>
<section class="kanvas potret kertas" id="potret-acara" style="display:grid;grid-template-rows:auto 1fr auto;gap:40px">
  <span class="segel" style="width:900px;height:900px;right:-300px;top:-260px"></span>
  <div class="g-atas"><img class="g-logo" src="../brand/wordmark.svg" alt="FUSIONIFY" width="300" height="52"></div>
  <div style="align-self:center;display:grid;gap:30px">
    <p class="g-kicker" data-isi="kicker">Acara</p>
    <h1 class="g-judul" style="max-width:820px"><span data-isi="judul">[Nama acara kamu]</span><span class="dot">.</span></h1>
    <div class="g-kartu" style="display:grid;gap:18px;max-width:620px;font-size:38px">
      <div><b style="font-family:var(--f-num);font-size:26px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)">Kapan</b><div data-isi="waktu">[Hari, tanggal · jam]</div></div>
      <div><b style="font-family:var(--f-num);font-size:26px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)">Di mana</b><div data-isi="tempat">[Tempat atau tautan online]</div></div>
    </div>
  </div>
  <div class="g-bawah"><span class="g-tombol" data-isi="ajakan">Daftar lewat link di bio</span></div>
  <img class="g-maskot fx-oversize" data-isi-src="maskot" src="../mascot/happy.webp" alt="" width="577" height="720" style="height:600px;right:-60px;bottom:-30px">
</section>
</body>
</html>
