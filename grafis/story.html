<!doctype html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grafis · story 1080x1920</title>
<link rel="stylesheet" href="grafis.css">
<script src="../dokumen/cetak/dokumen.js"></script>
<script src="grafis.js"></script>
</head>
<body class="pratinjau">
<!-- Story / sampul Reels & TikTok 1080x1920. Teks penting di dalam zona aman (pratinjau: ?panduan),
     karena bagian atas, bawah, dan kanan tertutup tombol aplikasi. -->
<h2>story-kabar · biru</h2>
<section class="kanvas story biru" id="story-kabar">
  <span class="segel" style="width:1300px;height:1300px;left:-110px;bottom:-260px"></span>
  <div style="position:absolute;left:96px;top:270px;right:160px;display:grid;gap:34px">
    <img class="g-logo" src="../brand/wordmark-white.svg" alt="FUSIONIFY" width="300" height="52">
    <p class="g-kicker" data-isi="kicker">Kabar produk</p>
    <h1 class="g-judul" style="font-size:136px"><span data-isi="judul">StudyDate.id sekarang beta</span><span class="dot">.</span></h1>
    <div><span class="g-chip beta" data-isi-status>Beta</span></div>
  </div>
  <img class="g-maskot fx-oversize" data-isi-src="maskot" src="../mascot/welcome.webp" alt="" width="522" height="720" style="height:800px;left:340px;bottom:300px">
  <span class="g-gelembung" style="left:120px;bottom:900px" data-isi="gelembung">Cobain yuk!</span>
  <span class="g-tombol" style="position:absolute;left:96px;bottom:440px;z-index:1" data-isi="url">studydate.id</span>
</section>

<h2>story-tips · kertas</h2>
<section class="kanvas story kertas" id="story-tips">
  <span class="segel" style="width:900px;height:900px;right:-300px;top:-200px"></span>
  <div style="position:absolute;left:96px;top:270px;right:160px;display:grid;gap:40px">
    <img class="g-logo" src="../brand/wordmark.svg" alt="FUSIONIFY" width="300" height="52">
    <p class="g-kicker" data-isi="kicker">Tips</p>
    <h1 class="g-judul"><span data-isi="judul">Bayar QRIS dengan tenang</span><span class="dot">.</span></h1>
    <ol class="g-daftar">
      <li data-isi="poin1">Cek nama penerima sebelum konfirmasi.</li>
      <li data-isi="poin2">Pastikan jumlahnya sama dengan tagihan.</li>
      <li data-isi="poin3">Simpan bukti bayar sampai pesanan selesai.</li>
    </ol>
  </div>
  <img class="g-maskot fx-oversize" data-isi-src="maskot" src="../mascot/glasses.webp" alt="" width="551" height="720" style="height:560px;right:110px;bottom:110px">
  <span class="g-url" style="position:absolute;left:96px;bottom:440px;color:var(--text-blue)" data-isi="url">fusionify.id</span>
</section>
</body>
</html>
